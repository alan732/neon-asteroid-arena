<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Last Stand</title>
  <meta name="theme-color" content="#07091a" />
  <style>
    :html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050713;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#game{position:fixed;inset:0}canvas{display:block}.overlay{position:fixed;inset:0;z-index:10;pointer-events:none}.hud{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 28px}.panel{background:linear-gradient(135deg,rgba(12,17,43,.88),rgba(8,10,26,.72));border:1px solid rgba(126,249,255,.18);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(12px)}.stats{padding:12px 16px;min-width:260px}.health-row{display:flex;align-items:center;gap:10px}.health{height:8px;flex:1;background:#1b2038;border-radius:99px;overflow:hidden}.health>i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff4d91,#ffb45e);box-shadow:0 0 12px #ff668a;transition:width .15s}.hud-label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#aab2d6}.wave{text-align:right;padding:12px 16px}.wave strong{display:block;font-size:24px;color:#77f2ff}.crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:1px solid rgba(180,250,255,.8);border-radius:50%;box-shadow:0 0 12px rgba(85,223,255,.35)}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#dffcff}.crosshair:before{width:6px;height:1px;left:-7px;top:8px}.crosshair:after{width:6px;height:1px;right:-7px;top:8px}.message{position:absolute;left:50%;top:28%;transform:translate(-50%,0);text-align:center;text-transform:uppercase;letter-spacing:.28em;font-weight:800;font-size:36px;text-shadow:0 0 24px #76efff;opacity:0}.message.show{animation:flash 2s ease}@keyframes flash{0%,100%{opacity:0;transform:translate(-50%,12px)}15%,75%{opacity:1;transform:translate(-50%,0)}}#menu{pointer-events:auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(30,69,118,.25),rgba(3,5,16,.82) 65%,#02030a)}.card{text-align:center;width:min(560px,calc(100% - 40px));padding:44px 38px}.eyebrow{color:#76efff;letter-spacing:.34em;text-transform:uppercase;font-size:11px}.card h1{margin:12px 0 8px;font-size:clamp(42px,8vw,76px);line-height:.92;letter-spacing:-.06em;text-shadow:0 0 30px rgba(102,227,255,.24)}.card h1 em{display:block;font-style:normal;color:#77f2ff}.card p{color:#aeb5d1;margin:18px auto 26px;max-width:430px}.btn{pointer-events:auto;border:0;border-radius:12px;padding:15px 30px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;color:#07101e;background:linear-gradient(135deg,#85fbff,#8d82ff);cursor:pointer;box-shadow:0 12px 30px rgba(91,210,255,.18);transition:.18s}.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 38px rgba(91,210,255,.28)}.controls{display:flex;justify-content:center;gap:14px;margin-top:24px;color:#7f87ac;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.controls b{color:#d8dcf7;margin-right:4px}.bottom{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:8px}.ability{width:48px;height:48px;display:grid;place-items:center;border-radius:10px;font-size:10px;color:#8d94ba}.ability.ready{color:#bdfcff;border-color:#76efff;box-shadow:0 0 18px rgba(91,223,255,.12)}.hidden{display:none!important}.damage{position:absolute;inset:0;box-shadow:inset 0 0 100px rgba(255,40,100,.0);transition:.1s}.damage.flash{box-shadow:inset 0 0 140px rgba(255,40,100,.55)}#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);padding:10px 14px;border-radius:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:0}.bossbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(420px,50vw);text-align:center;display:none}.bossbar strong{font-size:11px;letter-spacing:.2em;text-transform:uppercase}.bossbar i{display:block;height:5px;margin-top:7px;border-radius:99px;background:linear-gradient(90deg,#be75ff,#ff5b9d);box-shadow:0 0 16px #d36cff}@media(max-width:600px){.hud{padding:12px}.stats{min-width:180px}.card{padding:32px 20px}.controls{flex-wrap:wrap}.wave{padding:10px}.crosshair{opacity:.7}}</style>
</head>
<body>
  <div id="game"></div>
  <div class="overlay">
    <div class="damage" id="damage"></div>
    <div class="hud"><div class="panel stats"><div class="health-row"><span class="hud-label">Hull</span><div class="health"><i id="health"></i></div><b id="hp">100</b></div></div><div class="panel wave"><span class="hud-label">Sector</span><strong id="wave">1</strong><span class="hud-label" id="kills">0 hostiles</span></div></div>
    <div class="bossbar" id="bossbar"><strong id="bossname">Dread Warden</strong><i id="bosshealth"></i></div>
    <div class="crosshair"></div><div class="message" id="message"></div><div class="panel" id="toast"></div>
    <div class="bottom"><div class="panel ability ready" id="dash">SHIFT</div><div class="panel ability ready" id="pulse">E</div></div>
  </div>
  <div class="overlay" id="menu"><div class="panel card"><div class="eyebrow">Deep Sector 7</div><h1>Neon <em>Last Stand</em></h1><p>Survive escalating swarms, collect cores, and push the anomaly back beyond the edge of the galaxy.</p><button class="btn" id="start">Enter Arena</button><div class="controls"><span><b>WASD</b> Move</span><span><b>Mouse</b> Aim</span><span><b>LMB</b> Fire</span><span><b>Shift</b> Dash</span><span><b>E</b> Pulse</span></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const $=s=>document.querySelector(s), rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const game=$('#game'), scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x07091a,.012);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500); camera.position.set(0,18,23);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x93baff,0x08091a,1.25));const sun=new THREE.DirectionalLight(0xbdeaff,2);sun.position.set(-12,25,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x090d20,roughness:.62,metalness:.32}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(120,40,0x284c78,0x182746);grid.position.y=.012;grid.material.transparent=true;grid.material.opacity=.42;scene.add(grid);

const arena=new THREE.Group();scene.add(arena);for(let i=0;i<28;i++){const r=rand(18,52),a=rand(0,Math.PI*2);const p=new THREE.Mesh(new THREE.IcylinderGeometry||new THREE.CylinderGeometry(.7,1.2,rand(1,5),5),new THREE.MeshStandardMaterial({color:0x11172d,roughness:.8,metalness:.4,emissive:0x080a18}));p.position.set(Math.cos(a)*r,.1,Math.sin(a)*r);p.rotation.y=rand(0,6);p.castShadow=true;p.receiveShadow=true;arena.add(p)}

const stars=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:600},()=>rand(-90,90)),3)),new THREE.PointsMaterial({color:0x91bfff,size:.12,transparent:true,opacity:.7}));scene.add(stars);

let running=false,gameOver=false,time=0,wave=1,kills=0,shake=0,mouse=new THREE.Vector2(),keys={},dashReady=true,pulseReady=true;
const player=new THREE.Group();const ship=new THREE.Mesh(new THREE.ConeGeometry(1.05,2.8,5),new THREE.MeshStandardMaterial({color:0x73d8ff,emissive:0x1a91b8,emissiveIntensity:.8,roughness:.28,metalness:.7}));ship.rotation.x=Math.PI/2;ship.castShadow=true;player.add(ship);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,.09,8,32),new THREE.MeshBasicMaterial({color:0x9dffff,transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2;player.add(ring);scene.add(player);camera.lookAt(player.position);
const audio=new (window.AudioContext||window.webkitAudioContext)();function tone(freq,d=.08,type='sine',vol=.025){if(!running)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}

let bullets=[],enemies=[],particles=[],pickups=[];function bullet(){const b=new THREE.Mesh(new THREE.SphereGeometry(.15,6,6),new THREE.MeshBasicMaterial({color:0x9ffaff}));b.position.copy(player.position);b.position.y=1.1;const dir=new THREE.Vector3(mouse.x,0,-mouse.y);if(dir.lengthSq()<.1)dir.set(0,0,-1);dir.normalize();b.userData.vel=dir.multiplyScalar(38);b.userData.life=1.5;scene.add(b);bullets.push(b);tone(220,.05,'square',.018)}
function enemy(type='drone',boss=false){const g=new THREE.Group();let m;if(type==='brute'){m=new THREE.Mesh(new THREE.IcosahedronGeometry(1.35,1),new THREE.MeshStandardMaterial({color:0xff667f,emissive:0x7d1027,emissiveIntensity:.8,roughness:.35,metalness:.5}))}else if(boss){m=new THREE.Mesh(new THREE.IcosahedronGeometry(3.4,2),new THREE.MeshStandardMaterial({color:0xba70ff,emissive:0x57158c,emissiveIntensity:1.1,roughness:.25,metalness:.55}))}else{m=new THREE.Mesh(new THREE.OctahedronGeometry(.95,0),new THREE.MeshStandardMaterial({color:type==='shooter'?0xffbd65:0xff527b,emissive:type==='shooter'?0x743500:0x75102e,emissiveIntensity:.9,roughness:.3,metalness:.45}))}m.castShadow=true;g.add(m);const a=rand(0,Math.PI*2),r=boss?28:rand(24,34);g.position.set(Math.cos(a)*r,1,Math.sin(a)*r);g.userData={type,boss,hp:boss?160*(1+(wave-1)*.12):(type==='brute'?7:3)*(1+(wave-1)*.14),maxhp:0,contact:0,shot:rand(.5,2),phase:rand(0,6)};g.userData.maxhp=g.userData.hp;scene.add(g);enemies.push(g)}
function burst(pos,color=0x79efff,count=12){for(let i=0;i<count;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,4,4),new THREE.MeshBasicMaterial({color,transparent:true}));p.position.copy(pos);p.userData.vel=new THREE.Vector3(rand(-1,1),rand(.2,1),rand(-1,1)).normalize().multiplyScalar(rand(3,9));p.userData.life=rand(.35,.8);scene.add(p);particles.push(p)}}
function pickup(pos){const p=new THREE.Mesh(new THREE.OctahedronGeometry(.45,0),new THREE.MeshBasicMaterial({color:0x86ffe5,wireframe:true}));p.position.copy(pos);p.position.y=.8;p.userData.life=10;scene.add(p);pickups.push(p)}

let hp=100,shotCool=0,invuln=0;const raycaster=new THREE.Raycaster();window.addEventListener('mousemove',e=>{const rect=renderer.domElement.getBoundingRect?.()||renderer.domElement.getBoundingClientRect();raycaster.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1),camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),pt=new THREE.Vector3();if(raycaster.ray.intersectPlane(plane,pt))mouse.set(clamp(pt.x,-55,55),clamp(pt.z,-55,55));});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(running&&e.code==='ShiftLeft'&&dashReady)dash();if(running&&e.code==='KeyE'&&pulseReady)pulse()});window.addEventListener('keyup',e=>keys[e.code]=false);let firing=false;window.addEventListener('mousedown',()=>firing=true);window.addEventListener('mouseup',()=>firing=false);
function dash(){dashReady=false;$('#dash').classList.remove('ready');player.userData.dash=0.18;tone(130,.18,'sawtooth',.04);setTimeout(()=>{dashReady=true;$('#dash').classList.add('ready')},2200)}
function pulse(){pulseReady=false;$('#pulse').classList.remove('ready');burst(player.position,0xaaffee,24);tone(90,.45,'triangle',.06);enemies.forEach(e=>{const d=e.position.distanceTo(player.position);if(d<11){e.userData.hp-=e.userData.boss?18:8;e.position.add(e.position.clone().sub(player.position).normalize().multiplyScalar(3)}});setTimeout(()=>{pulseReady=true;$('#pulse').classList.add('ready')},7000)}

function spawnWave(){kills=0;$('#kills').textContent='0 hostiles';showMessage(wave%5?'WAVE '+wave:'WARDEN APPROACHES');const count=4+wave*3;if(wave%5===0)enemy('boss',true);for(let i=0;i<count;i++)setTimeout(()=>enemy(wave>2&&Math.random()<.28?(Math.random()<.5?'brute':'shooter'):'drone'),i*180)}
function showMessage(text){const m=$('#message');m.textContent=text;m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}
function damage(v){if(invuln>0)return;hp-=v;invuln=.55;$('#health').style.width=hp+'%';$('#hp').textContent=Math.ceil(hp);$('#damage').classList.add('flash');setTimeout(()=>$('#damage').classList.remove('flash'),100);shake=.22;tone(55,.12,'sawtooth',.05);if(hp<=0){endGame()}}
function endGame(){running=false;gameOver=true;$('#menu').classList.remove('hidden');$('#menu').innerHTML='<div class="panel card"><div class="eyebrow">Signal Lost</div><h1>Sector <em>Overrun</em></h1><p>You held '+kills+' hostiles in the final sector.</p><button class="btn" id="again">Retry</button></div>';$('#again').addEventListener('click',reset)}
function reset(){location.reload()}$('#start').addEventListener('click',()=>{running=true;$('#menu').classList.add('hidden');audio.resume();spawnWave();tone(180,.3,'triangle',.04)});

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.034);time+=dt;if(running){const move=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(move.lengthSq())move.normalize().multiplyScalar(player.userData.dash?22:9);else move.set(0,0,0);player.position.addScaledVector(move,dt);player.position.x=clamp(player.position.x,-48,48);player.position.z=clamp(player.position.z,-48,48);const target=new THREE.Vector3(mouse.x,0,mouse.y);player.lookAt(target);ship.rotation.x=Math.PI/2;if(player.userData.dash){player.userData.dash-=dt;if(player.userData.dash<=0)delete player.userData.dash}shotCool-=dt;if(firing&&shotCool<=0){shotCool=.105;bullet()}invuln-=dt;
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.addScaledVector(b.userData.vel,dt);b.userData.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(b.position.distanceTo(e.position)<(e.userData.boss?3.5:1.25)){e.userData.hp-=1.2;b.userData.life=0;burst(b.position,0x9ffaff,5);hit=true;if(e.userData.hp<=0){burst(e.position,e.userData.type==='brute'?0xff7695:(e.userData.boss?0xb778ff:0xffbe78),e.userData.boss?40:16);if(Math.random()<.18)pickup(e.position);scene.remove(e);enemies.splice(j,1);kills++;$('#kills').textContent=kills+' hostiles';tone(e.userData.boss?60:330,.12,'triangle',.04)}break}}if(b.userData.life<=0||b.position.length()>60){scene.remove(b);bullets.splice(i,1)}}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],u=e.userData;u.phase+=dt;e.rotation.y+=dt*(u.boss?1.1:2);const to=player.position.clone().sub(e.position),dist=to.length(),dir=to.normalize();if(u.type==='shooter'&&dist<18){e.position.addScaledVector(dir,.01)}else if(dist>1.5)e.position.addScaledVector(dir,dt*(u.boss?2.8:u.type==='brute'?2.2:u.type==='shooter'?3:4));if(dist<(u.boss?4:1.55))damage(u.boss?12:u.type==='brute'?9:5);if(u.type==='shooter'||u.boss){u.shot-=dt;if(u.shot<=0&&dist<26){u.shot=u.boss?.9:1.8;const b=new THREE.Mesh(new THREE.SphereGeometry(u.boss?.32:.22,6,6),new THREE.MeshBasicMaterial({color:u.boss?0xd29cff:0xff9b72}));b.position.copy(e.position);b.position.y=1;b.userData={vel:dir.multiplyScalar(u.boss?12:9),life:4,enemy:true};scene.add(b);bullets.push(b)}}if(u.boss){$('#bossbar').style.display='block';$('#bosshealth').style.width=(u.hp/u.maxhp*100)+'%'}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];if(b.userData.enemy){b.position.addScaledVector(b.userData.vel,dt);b.userData.life-=dt;if(b.position.distanceTo(player.position)<1.1){damage(8);b.userData.life=0}if(b.userData.life<=0){scene.remove(b);bullets.splice(i,1)}}}
for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];p.rotation.y+=dt*3;p.position.y=.8+Math.sin(time*4)*.25;p.userData.life-=dt;if(p.position.distanceTo(player.position)<1.6){hp=clamp(hp+20,0,100);$('#health').style.width=hp+'%';$('#hp').textContent=Math.ceil(hp);burst(p.position,0x86ffe5,14);tone(520,.12,'sine',.04);scene.remove(p);pickups.splice(i,1)}else if(p.userData.life<=0){scene.remove(p);pickups.splice(i,1)}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.position.addScaledVector(p.userData.vel,dt);p.userData.vel.y-=dt*2;p.userData.life-=dt;p.material.opacity=clamp(p.userData.life/.8,0,1);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}
if(enemies.length===0&&!gameOver){const active=bullets.some(b=>b.userData.enemy);$('#bossbar').style.display='none';wave++;$('#wave').textContent=wave;spawnWave()}
const desired=player.position.clone().add(new THREE.Vector3(0,18,23));camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(player.position);stars.rotation.y+=dt*.003;grid.position.z=(grid.position.z+dt*1.2)%3;if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.z+=(Math.random()-.5)*shake;shake*=.82}ring.rotation.z+=dt*2}
renderer.render(scene,camera)}animate();
</script>
</body>
</html>
